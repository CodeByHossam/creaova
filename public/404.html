<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | Creaova Digital Solutions</title>
  <meta name="description" content="The page you were looking for could not be found. Head back to the Creaova Digital Solutions homepage." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=2026-10-22" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2026-10-22" />
  <style>
    /* A built HTML file with a hashed stylesheet cannot be linked by hand, so
       this one document carries its own tokens: the same self-hosted faces and
       the same paper / ink / hairline palette as the app. */
    @font-face {
      font-family: "Roboto Slab";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("/fonts/robotoslab-500-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Roboto";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/roboto-400-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Roboto";
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url("/fonts/roboto-600-latin.woff2") format("woff2");
    }

    :root { color-scheme: light; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 5vw, 4rem);
      background: #faf9f6;
      color: #16130f;
      font-family: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 68ch; }
    .code {
      margin: 0;
      font-family: "Roboto Slab", Georgia, "Times New Roman", serif;
      font-size: clamp(4.5rem, 18vw, 9rem);
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    h1 {
      margin: 1.5rem 0 0;
      font-family: "Roboto Slab", Georgia, "Times New Roman", serif;
      font-size: clamp(1.75rem, 5vw, 2.75rem);
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }
    p.copy {
      margin: 1rem 0 0;
      max-width: 52ch;
      color: #57534e;
      font-size: 1rem;
    }
    a.home {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      margin-top: 2rem;
      padding: 0 1.25rem;
      border-radius: 0.5rem;
      background: #16130f;
      color: #faf9f6;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 200ms ease-out, color 200ms ease-out;
    }
    a.home:hover { background: #c2410c; color: #16130f; }
    a.home:focus-visible { outline: 2px solid #c2410c; outline-offset: 2px; }
    hr { border: 0; border-top: 1px solid #e7e3dc; margin: 2.5rem 0 0; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>We couldn’t find that page.</h1>
    <p class="copy">The link may be out of date, or the page may have moved. Head back to the homepage and start from there.</p>
    <a class="home" href="/">Back to homepage</a>
    <hr />
  </main>
</body>
</html>
