<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Creaova [ C DS ] — Email signature</title>
    <!--
      Standalone email signature for Creaova Digital Solutions.
      Table-based + inline CSS on purpose: webmail and desktop clients strip
      <style> blocks, classes, and flex/grid. No Tailwind here.

      TEMPLATE — do not edit public/email-signature.html directly. Edit this
      file and run `npm run sync:site-url`; https://creaova.onrender.com is replaced with
      VITE_SITE_URL from .env. The logo must be publicly reachable at
      https://creaova.onrender.com/logo.png.

      The graphic is the brand lockup - the mark with the "CREAOVA" wordmark
      already baked into it - so the name is NOT repeated as live text below.
      One wordmark, one brand.

      The `?v=` on the image URL busts the mail client's image cache. Keep it in
      sync with ASSET_VERSION in app/data/constants.ts.
    -->
  </head>
  <body style="margin: 0; padding: 16px; background-color: #ffffff;">
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="border-collapse: collapse; font-family: Arial, Helvetica, sans-serif;"
    >
      <tr>
        <td style="padding: 0 16px 0 0; vertical-align: top;">
          <a href="https://creaova.onrender.com" style="border: 0; text-decoration: none;">
            <img
              src="https://creaova.onrender.com/logo.png?v=2026-10-22"
              alt="Creaova Digital Solutions"
              width="175"
              height="40"
              style="display: block; width: 175px; height: 40px; border: 0;"
            />
          </a>
        </td>
        <td style="padding: 0; vertical-align: top;">
          <p
            style="margin: 0; font-size: 11px; color: #57534e; letter-spacing: 0.18em; text-transform: uppercase;"
          >
            Digital Solutions [ C DS ]
          </p>
          <p
            style="margin: 10px 0 0; font-family: 'Courier New', Courier, monospace; font-size: 12px; color: #c2410c;"
          >
            &lt; Creativity meets innovation /&gt;
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
